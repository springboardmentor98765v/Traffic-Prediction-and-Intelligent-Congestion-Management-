services:
  db:
    image: postgres:16-alpine
    container_name: trafficvision-postgres
    environment:
      POSTGRES_DB: trafficvision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: trafficvision-backend
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/trafficvision
      JWT_SECRET_KEY: trafficvision-development-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: