services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: trafficvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trafficvision
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: change_me
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traffic -d trafficvision']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trafficvision-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_updated/backend/Intern_AI AND ML
      dockerfile: Dockerfile
    container_name: trafficvision-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://traffic:change_me@postgres:5432/trafficvision
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ALERT_API_URL: http://backend:8000/api/v1/alerts/
      PYTHONUNBUFFERED: '1'
    env_file:
      - .env.dev
    ports:
      - '8000:8000'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  analytics:
    image: trafficvision-backend:latest
    container_name: trafficvision-analytics
    restart: unless-stopped
    working_dir: /app/src
    env_file:
      - .env.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: trafficvision
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: change_me
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ANALYTICS_CACHE_TTL: '60'
      ALERT_API_URL: http://backend:8000/api/v1/alerts/
      PYTHONUNBUFFERED: '1'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8001:8001'
    volumes:
      - ./daa/M3_Day6_Traffic_Monitoring_:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_data:
