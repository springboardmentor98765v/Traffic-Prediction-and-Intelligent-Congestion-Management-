# TrafficVision AI — production deployment on Render's free tier (Milestone 4, Intern 5).
#
# Render Dashboard -> New -> Blueprint -> pick this repo. Render creates the four
# services below and asks once for the `sync: false` values (DATABASE_URL of the
# production Postgres and the Upstash REDIS_URL). Full walkthrough: docs/final/DEPLOYMENT_GUIDE.md
#
#   tv-team1-backend    API gateway: Auth, Monitoring, Prediction, Route, Alerts
#   tv-team1-analytics  Analytics service (Intern 2)
#   tv-team1-ai         AI Insights / anomaly detection (Intern 3)
#   tv-team1-web        Static frontend (Intern 4)
#
# Deploys are triggered by the CI/CD deploy stage after lint/build/tests pass
# (.github/workflows/ci.yml -> QA/milestone4/day3/render_deploy.py), so
# autoDeployTrigger is off here. Database: Render Postgres set up by Intern 2 (free tier,
# expires 30 days after creation -> daily backups in .github/workflows/db-backup.yml; Neon
# is the drop-in fallback, same DATABASE_URL contract). Cache: Upstash Redis (free).
#
# Free-tier limits that matter: 512 MB RAM per service, services sleep after 15 min
# idle (~1 min to wake), 750 instance-hours per month for the whole workspace.
# Region: oregon, the same region as the production Postgres (Intern 2), so every
# query stays inside one data centre instead of crossing from Asia to the US.

envVarGroups:
  - name: trafficvision-shared
    envVars:
      # Production Postgres. Intern 2's Render DB: use its *External* Database URL with
      # ?sslmode=require (free web services can't use Render's private network).
      - key: DATABASE_URL
        sync: false
      # Upstash Redis URL, e.g. rediss://default:pass@xxx.upstash.io:6379
      - key: REDIS_URL
        sync: false
      # Generated once by Render and shared, so tokens and the alert key match across services.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALERT_SERVICE_KEY
        generateValue: true
      # DEF-M4-006: only the hosted frontend may call the APIs from a browser.
      - key: CORS_ALLOWED_ORIGINS
        value: https://tv-team1-web.onrender.com
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: '1'

services:
  - name: tv-team1-backend
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: './backend_updated/backend/Intern_AI AND ML/Dockerfile'
    dockerContext: './backend_updated/backend/Intern_AI AND ML'
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - fromGroup: trafficvision-shared
      - key: PORT
        value: '8000'

  - name: tv-team1-analytics
    type: web
    runtime: docker
    plan: free
    region: oregon
    # Intern 2 ships no Dockerfile; the backend one (pip install -r requirements.txt +
    # COPY . .) works with the analytics folder as context, same as docker-compose.prod.yml.
    dockerfilePath: './backend_updated/backend/Intern_AI AND ML/Dockerfile'
    dockerContext: './daa/M3_Day6_Traffic_Monitoring_'
    dockerCommand: uvicorn main:app --app-dir /app/src --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /
    autoDeployTrigger: 'off'
    envVars:
      - fromGroup: trafficvision-shared
      - key: PORT
        value: '8001'
      - key: ANALYTICS_CACHE_ENABLED
        value: 'true'
      - key: ANALYTICS_CACHE_TTL_SECONDS
        value: '60'
      - key: ALERT_API_URL
        value: https://tv-team1-backend.onrender.com/api/v1/alerts/

  - name: tv-team1-ai
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: './TrafficVision-AI m3/TrafficVision-AI/ai-engine/Dockerfile'
    dockerContext: './TrafficVision-AI m3/TrafficVision-AI'
    dockerCommand: uvicorn app:app --host 0.0.0.0 --port 8010 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - fromGroup: trafficvision-shared
      - key: PORT
        value: '8010'
      # Free services can't use Render's private network, so service-to-service calls
      # go through the public URL.
      - key: TRAFFIC_API_URL
        value: https://tv-team1-backend.onrender.com/api/v1/traffic/live

  - name: tv-team1-web
    type: web
    runtime: static
    buildCommand: echo "Static HTML pages, no build step"
    staticPublishPath: './Front-end(m-3) (1)/Front-end'
    autoDeployTrigger: 'off'
    routes:
      - type: rewrite
        source: /
        destination: /Login.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
