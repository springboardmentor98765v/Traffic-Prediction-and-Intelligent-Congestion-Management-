name: TrafficVision AI - CI

on:
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Lint and Build
    if: ${{ hashFiles('frontend/package.json') != '' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Lint and Test
    if: ${{ hashFiles('backend/requirements.txt') != '' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest

      - name: Check Black formatting
        run: black --check .

      - name: Run Flake8
        run: flake8 .

      - name: Run tests
        run: pytest -q

# Milestone 1: lint + build + test only.
# No deployment stage is included.
  api-tests:
    name: API Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: srinath-devops/API_TESTING_SKELETON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API test dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest -q
