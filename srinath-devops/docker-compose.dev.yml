# ==============================================================================
# TrafficVision AI — Milestone 2 Local Development & Integration Environment
# ==============================================================================
# NOTE: Strictly for LOCAL development and integration testing.
# Production deployment to AWS, Azure, GCP, or Kubernetes is explicitly
# OUT OF SCOPE for Milestone 2 and reserved for Milestone 4.
# ==============================================================================

version: "3.8"

networks:
  trafficvision-dev-net:
    driver: bridge

volumes:
  timescale_data:
    driver: local
  redis_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Primary Relational & Time-Series Database (PostgreSQL + TimescaleDB)
  # ----------------------------------------------------------------------------
  timescale-db:
    image: timescale/timescaledb:latest-pg16
    container_name: trafficvision-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: trafficvision
      POSTGRES_USER: trafficvision
      POSTGRES_PASSWORD: trafficvision_dev_password
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - trafficvision-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficvision -d trafficvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # 2. In-Memory Cache (Redis) for Live Traffic, Conditions & Route Caching
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trafficvision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trafficvision-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

