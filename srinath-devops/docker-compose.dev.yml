      NEXT_PUBLIC_MAP_TILE_PROVIDER: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - trafficvision-dev-net
