      SERVICE_NAME: "TrafficVision AI - Data Pipeline"
      DATABASE_URL: "postgresql://trafficvision:trafficvision_dev_password@timescale-db:5432/trafficvision"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
