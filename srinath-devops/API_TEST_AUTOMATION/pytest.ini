[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
timeout = 10
markers =
    prediction: Tests covering the AI Prediction Service
    route: Tests covering the Route Analysis Service
    historical: Tests covering Historical Traffic Data pipelines
    conditions: Tests covering Road Conditions and Hazard endpoints
    rbac: Tests covering Role-Based Access Control
    latency: Tests validating performance and response time bounds
