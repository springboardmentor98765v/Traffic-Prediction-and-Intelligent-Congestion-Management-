name: Live QA

# Milestone 4 Days 3-6: run the live-system QA suites against production from GitHub
# (Actions -> Live QA -> Run workflow). Reports land in the run summary and as an artifact;
# commit the ones you want to keep into QA/milestone4/dayN/.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        default: smoke
        options:
          - smoke # Day 3
          - full-system # Day 4
          - ui-selenium # Day 4-6, Chrome + Firefox, desktop/tablet/mobile
          - performance # Day 5
          - final-regression # Day 6
      stability_minutes:
        description: Day 6 stability window (minutes)
        default: '10'

jobs:
  live-qa:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://trafficvision-ai-i8e2.onrender.com' }}
      ANALYTICS_URL: ${{ vars.ANALYTICS_URL || 'https://trafficvision-ai-i8e2.onrender.com/analytics' }}
      AI_URL: ${{ vars.AI_URL || 'https://trafficvision-ai-i8e2.onrender.com/ai-engine' }}
      WEB_URL: ${{ vars.WEB_URL || 'https://trafficvision-ai-i8e2.onrender.com' }}
      # Optional: alert producer checks and operator/admin test accounts.
      ALERT_SERVICE_KEY: ${{ secrets.ALERT_SERVICE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install psycopg2 (QA account promotion) and Selenium
        run: pip install psycopg2-binary selenium

      - name: Run suite
        run: |
          mkdir -p qa-out
          case "${{ inputs.suite }}" in
            smoke)
              python QA/milestone4/day3/smoke_test_live.py --report qa-out/smoke_results.md --json qa-out/smoke_results.json ;;
            full-system)
              python QA/milestone4/day4/full_system_test.py --report qa-out/full_system_test_report.md --json qa-out/full_system_results.json ;;
            ui-selenium)
              python QA/milestone4/day4/selenium_ui_test.py --browsers chrome,firefox --report qa-out/selenium_ui_report.md --json qa-out/selenium_ui_results.json --shots qa-out/screenshots ;;
            performance)
              python QA/milestone4/day5/performance_check.py --report qa-out/performance_report.md --json qa-out/performance_results.json ;;
            final-regression)
              python QA/milestone4/day6/final_regression.py --stability-minutes "${{ inputs.stability_minutes }}" --report qa-out/final_regression_report.md
              cp QA/milestone4/day6/*.json qa-out/ 2>/dev/null || true ;;
          esac

      - name: Publish report
        if: always()
        run: cat qa-out/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report produced" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-${{ inputs.suite }}-${{ github.run_number }}
          path: qa-out/
