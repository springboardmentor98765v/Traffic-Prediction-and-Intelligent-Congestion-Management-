name: CI/CD

# Milestone 4 Day 2-3 (Intern 5): lint -> build -> test -> deploy (Render free tier).
# lint, build and tests run in parallel for fast feedback; deploy waits for all three,
# so nothing reaches production unless every earlier stage is green.
# Design notes: QA/milestone4/day2/cicd_pipeline.md; deploy target setup: docs/final/DEPLOYMENT_GUIDE.md

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Backend lives in a folder with spaces; quote "$BACKEND_DIR" everywhere.
# Same variable/default as docker-compose.dev.yml and the root conftest.py.
env:
  BACKEND_DIR: backend_updated/backend/Intern_AI AND ML
  ANALYTICS_DIR: daa/M3_Day6_Traffic_Monitoring_
  AI_DIR: TrafficVision-AI m3/TrafficVision-AI
  FRONTEND_DIR: Front-end(m-3) (1)/Front-end
  # Images are pushed (and deployed) only from main, never from PRs or develop.
  IS_RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8
          npm install

      - name: Python lint and format (backend, analytics, QA)
        run: |
          flake8 "$BACKEND_DIR" "$ANALYTICS_DIR" QA
          python -m black --check "$BACKEND_DIR" "$ANALYTICS_DIR" QA

      - name: Frontend inline-script syntax (ESLint doesn't read HTML)
        run: |
          node QA/tools/check_inline_js.js "$FRONTEND_DIR"/*.html

      - name: Frontend lint and format
        run: |
          npm run lint
          npm run format

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Analytics ships no Dockerfile of its own; it reuses the backend Dockerfile (same
    # base image, `pip install -r requirements.txt` + `COPY . .`) with its own context.
    # docker-compose.prod.yml overrides its working_dir/command.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend_updated/backend/Intern_AI AND ML
            file: backend_updated/backend/Intern_AI AND ML/Dockerfile
          - service: analytics
            context: daa/M3_Day6_Traffic_Monitoring_
            file: backend_updated/backend/Intern_AI AND ML/Dockerfile
          - service: ai
            context: TrafficVision-AI m3/TrafficVision-AI
            file: TrafficVision-AI m3/TrafficVision-AI/ai-engine/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR image names must be lower-case.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trafficvision-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable sha-<commit> tag is what deploy uses (rollback = redeploy an older sha).
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.IS_RELEASE == 'true' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trafficvision
          POSTGRES_USER: traffic
          POSTGRES_PASSWORD: trafficpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traffic -d trafficvision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+psycopg2://traffic:trafficpass@localhost:5432/trafficvision
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      JWT_SECRET_KEY: test-only-ci-secret-key-for-ci-2026
      SECRET_KEY: test-only-ci-secret-key-for-ci-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$BACKEND_DIR/requirements.txt" -r "$ANALYTICS_DIR/requirements.txt"
          pip install -r "$AI_DIR/ai-engine/requirements.txt"
          pip install pytest

      - name: Verify backend imports
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m compileall -q app
          python -c "import app.main; print(app.main.app.title)"

      # testpaths in pyproject.toml: tests/, backend tests, QA/milestone*/tests.
      # Live-stack tests skip themselves here (no docker compose stack in CI).
      - name: Run automated tests
        run: |
          pytest -q

      # Intern 2's own suite opens sql/ and src/ by relative path, so it runs from ANALYTICS_DIR.
      - name: Run Analytics service tests (Data)
        working-directory: ${{ env.ANALYTICS_DIR }}
        run: |
          pytest -q tests

      - name: Run AI service tests
        run: |
          pytest -q "$AI_DIR/ai-engine/tests"

  deploy:
    needs: [lint, build, tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys at once.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    # Target: Render free tier (render.yaml), Render Postgres, Upstash Redis. Setup steps:
    # docs/final/DEPLOYMENT_GUIDE.md. Secrets live in GitHub (Settings -> Environments ->
    # production), never in the repo; app secrets live in Render's env var group.
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_IDS: ${{ secrets.RENDER_SERVICE_IDS }}
      # Optional repo variables, only needed if Render gave a service a different subdomain.
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://tv-team1-backend.onrender.com' }}
      ANALYTICS_URL: ${{ vars.ANALYTICS_URL || 'https://tv-team1-analytics.onrender.com' }}
      AI_URL: ${{ vars.AI_URL || 'https://tv-team1-ai.onrender.com' }}
      WEB_URL: ${{ vars.WEB_URL || 'https://tv-team1-web.onrender.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Until the Render services exist the stage reports "not configured" instead of
      # failing every main build.
      - name: Check deploy target is configured
        id: target
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_IDS" ]; then
            echo "::warning::Deploy skipped: RENDER_API_KEY / RENDER_SERVICE_IDS not set in the 'production' environment."
            echo "### Deploy skipped: production target not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.target.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deploys exactly the commit that passed lint/build/tests. If any service fails to
      # build or start, the ones already live are rolled back by the script itself.
      - name: Deploy this commit to Render
        if: steps.target.outputs.configured == 'true'
        run: |
          python QA/milestone4/day3/render_deploy.py deploy --commit "$GITHUB_SHA" --state deploy_state.json

      - name: Post-deploy health check
        id: health
        if: steps.target.outputs.configured == 'true'
        run: |
          python QA/milestone4/day2/post_deploy_health.py --timeout 300 \
            --url backend="$BACKEND_URL" --url analytics="$ANALYTICS_URL" --url ai="$AI_URL" \
            --json health_results.json

      - name: Smoke test (live)
        id: smoke
        if: steps.target.outputs.configured == 'true'
        run: |
          python QA/milestone4/day3/smoke_test_live.py --report smoke_results.md

      - name: Roll back to the previous release
        if: failure() && steps.target.outputs.configured == 'true' && (steps.health.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          python QA/milestone4/day3/render_deploy.py rollback --state deploy_state.json

      - name: Publish results
        if: always() && steps.target.outputs.configured == 'true'
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::12}\`"
            echo "Frontend: $WEB_URL"
            echo
            [ -f smoke_results.md ] && cat smoke_results.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deploy evidence
        if: always() && steps.target.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ github.sha }}
          path: |
            deploy_state.json
            health_results.json
            smoke_results.md
          if-no-files-found: ignore
