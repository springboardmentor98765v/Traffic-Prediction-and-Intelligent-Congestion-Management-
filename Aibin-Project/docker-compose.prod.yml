# ==============================================================================
# TrafficVision AI — Production Docker Compose Specification
# Milestone 4 Production Deployment
# Single public ingress: API Gateway on port 8080
# Database: External Managed PostgreSQL (via DATABASE_URL)
# ==============================================================================

name: trafficvision-prod

services:
  # ----------------------------------------------------------------------------
  # 1. API GATEWAY & AUTHENTICATION SERVICE (Intern 1)
  # The ONLY publicly accessible entry point to the backend mesh.
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: trafficvision-gateway:prod
    container_name: trafficvision-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      route-analysis:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      traffic-monitoring:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_GLOBAL_PER_MIN=${RATE_LIMIT_GLOBAL_PER_MIN:-120}
      - RATE_LIMIT_AUTH_PER_MIN=${RATE_LIMIT_AUTH_PER_MIN:-10}
      - TRUST_PROXIES=true
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - DATA_ENGINEERING_URL=http://traffic-monitoring:8000
      - TRAFFIC_SERVICE_URL=http://traffic-monitoring:8000
      - AI_ENGINE_URL=http://ai-engine:8001
      - PREDICTION_SERVICE_URL=http://ai-engine:8001
      - ROUTE_ANALYSIS_URL=http://route-analysis:8002
      - ALERT_SERVICE_URL=http://alert-service:8003
    networks:
      - trafficvision-internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  # ----------------------------------------------------------------------------
  # 2. ROUTE ANALYSIS MICROSERVICE (Intern 1)
  # Internal only: Resolves corridor routes & ETA via OSRM + AI
  # ----------------------------------------------------------------------------
  route-analysis:
    build:
      context: .
      dockerfile: route_analysis/Dockerfile
    image: trafficvision-route-analysis:prod
    container_name: trafficvision-route-analysis
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      - APP_ENV=production
      - SERVICE_PORT=8002
      - OSRM_BASE_URL=${OSRM_BASE_URL:-https://router.project-osrm.org}
      - AI_ENGINE_URL=http://ai-engine:8001
      - DATA_ENGINEERING_URL=http://traffic-monitoring:8000
    networks:
      - trafficvision-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. ALERT MICROSERVICE (Intern 1)
  # Internal only: Stores incident & congestion alerts in Managed Postgres
  # ----------------------------------------------------------------------------
  alert-service:
    build:
      context: .
      dockerfile: alert_service/Dockerfile
    image: trafficvision-alert-service:prod
    container_name: trafficvision-alert-service
    restart: unless-stopped
    expose:
      - "8003"
    environment:
      - APP_ENV=production
      - PORT=8003
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - trafficvision-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 4. TRAFFIC MONITORING & ANALYTICS SERVICE (Intern 2 - anmol-data)
  # Internal only: Live sensor readings, congestion history, analytics
  # ----------------------------------------------------------------------------
  traffic-monitoring:
    build:
      context: ../anmol-data
      dockerfile: ../aibin-backend/docker/Dockerfile.traffic
    image: trafficvision-traffic-monitoring:prod
    container_name: trafficvision-traffic-monitoring
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - trafficvision-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 5. AI / ML PREDICTION ENGINE (Intern 3 - saksham-aiml)
  # Internal only: Real-time ML congestion inference & anomaly detection
  # ----------------------------------------------------------------------------
  ai-engine:
    build:
      context: ../saksham-aiml
      dockerfile: ../aibin-backend/docker/Dockerfile.ai
    image: trafficvision-ai-engine:prod
    container_name: trafficvision-ai-engine
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - APP_ENV=production
      - PORT=8001
      - ALERT_SERVICE_URL=http://alert-service:8003
    networks:
      - trafficvision-internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 6. REDIS IN-MEMORY CACHE
  # Internal only: High-speed caching for live traffic & gateway rate limits
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trafficvision-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --loglevel warning
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - trafficvision-internal
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

# ------------------------------------------------------------------------------
# NETWORKS
# Completely private internal overlay/bridge network for microservice isolation
# ------------------------------------------------------------------------------
networks:
  trafficvision-internal:
    driver: bridge
