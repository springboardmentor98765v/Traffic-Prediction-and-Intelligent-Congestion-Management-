# TrafficVision AI - Production Nginx Configuration
# Milestone 4 Production Release

server {
    listen 80;
    server_name localhost _;

    root /usr/share/nginx/html;
    index Login.html index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root location & Clean Multi-Page Routing
    location / {
        try_files $uri $uri/ $uri.html /Login.html;
    }

    # HTML Caching Policy (No stale HTML)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static Assets Caching Policy (1 day cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Reverse Proxy Rules for Unified Docker Compose Deployments
    # Routes /api/v1 calls directly to backend Gateway if container network is present
    location /api/v1/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream "http://gateway:8000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Reverse Proxy Rules for Analytics microservice
    location /analytics/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $analytics_upstream "http://analytics:8001";
        proxy_pass $analytics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Custom Error Pages
    error_page 404 /Login.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
