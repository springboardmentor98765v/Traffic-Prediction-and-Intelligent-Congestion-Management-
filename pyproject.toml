[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "tests",
    "backend_updated/backend/Intern_AI AND ML/tests",
    "QA/milestone1/tests",
    "QA/milestone3/tests",
]
