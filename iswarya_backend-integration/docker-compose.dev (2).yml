# TrafficVision AI — shared local development stack (M1 + M2 + M3)
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Milestone 3 (Intern 5): Day 2 added the Alert Service; Day 6 added the
# Analytics Service (Intern 2, port 8001). The top-level `version` key was removed
# (obsolete in Compose v2, DEF-M3-003).

x-backend-dir: &backend_dir ${BACKEND_DIR:-./backend_milestone_3/backend/Intern_AI AND ML}

services:
  # TimescaleDB is a drop-in PostgreSQL image with the time-series extension
  # available (`CREATE EXTENSION IF NOT EXISTS timescaledb;`), per the M2 SRS's
  # time-series storage requirement (Section 2). Swapped from postgres:16-alpine
  # so Intern 2's historical_traffic / traffic_history tables can become
  # hypertables without another image change later.
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: trafficvision-postgres-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trafficvision}
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-traffic} -d ${POSTGRES_DB:-trafficvision}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trafficvision_net

  redis:
    image: redis:7-alpine
    container_name: trafficvision-redis-dev
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trafficvision_net

  # API gateway: Auth, Traffic Monitoring, Prediction, Route Analysis (M1/M2)
  # and the M3 Alert Service (Intern 1), which ships as the /api/v1/alerts
  # router inside this same FastAPI app rather than as a separate process.
  backend:
    image: trafficvision-backend:dev
    build:
      context: *backend_dir
      dockerfile: Dockerfile
    container_name: trafficvision-backend-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://traffic:change_me@postgres:5432/trafficvision}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PYTHONUNBUFFERED: '1'
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    volumes:
      - type: bind
        source: *backend_dir
        target: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - trafficvision_net

  # M3 Analytics Service (Intern 2): /analytics/trends, /heatmap, /reports
  # plus the M2 traffic-monitoring endpoints, from ./Data/M3_Day6_Traffic_Monitoring_ (FastAPI app
  # src/main.py). Intern 2 ships no Dockerfile; its deps (fastapi, uvicorn,
  # psycopg2, redis, dotenv) are a subset of the backend image, so it reuses
  # that image. Runs on 8001 because the gateway owns 8000.
  # DB tables/data: see QA/milestone3/day6/analytics_setup.sh (one-time).
  analytics:
    image: trafficvision-backend:dev
    container_name: trafficvision-analytics-dev
    restart: unless-stopped
    working_dir: /app/src
    # For ALERT_SERVICE_KEY: the congestion watcher posts to the internal alert endpoint.
    env_file:
      - .env.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-trafficvision}
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ANALYTICS_CACHE_ENABLED: 'true'
      ANALYTICS_CACHE_TTL_SECONDS: '60'
      ALERT_API_URL: http://backend:8000/api/v1/alerts/
      PYTHONUNBUFFERED: '1'
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${ANALYTICS_PORT:-8001}:8001'
    volumes:
      - type: bind
        source: ${ANALYTICS_DIR:-./Data/M3_Day6_Traffic_Monitoring_}
        target: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - trafficvision_net

  # M3 AI Insights Service (Intern 1): recommendations and anomaly detection.
  # The source is mounted at its original nested path so model and data paths
  # used by the application resolve consistently in Docker and locally.
  ai:
    build:
      context: ./TrafficVision-AI m3/TrafficVision-AI
      dockerfile: ai-engine/Dockerfile
    container_name: trafficvision-ai-dev
    restart: unless-stopped
    working_dir: /workspace/TrafficVision-AI/ai-engine
    volumes:
      - type: bind
        source: ./TrafficVision-AI m3/TrafficVision-AI
        target: /workspace/TrafficVision-AI
    ports:
      - '${AI_PORT:-8010}:8010'
    command: uvicorn app:app --host 0.0.0.0 --port 8010
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - trafficvision_net

networks:
  trafficvision_net:
    driver: bridge

volumes:
  postgres_data_dev:
