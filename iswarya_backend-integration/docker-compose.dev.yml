version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trafficvision-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: traffic_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trafficvision_net

  redis:
    image: redis:7-alpine
    container_name: trafficvision-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trafficvision_net

  backend:
    build:
      context: .
    container_name: trafficvision-backend-dev
    restart: unless-stopped
    environment:
      # Updated to match the postgres service credentials and database name exactly
      DATABASE_URL: postgresql+psycopg2://postgres:12345678@postgres:5432/traffic_auth
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: '1'
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - trafficvision_net

networks:
  trafficvision_net:
    driver: bridge

volumes:
  postgres_data_dev: