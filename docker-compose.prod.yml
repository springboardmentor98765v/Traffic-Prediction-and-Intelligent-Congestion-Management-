# TrafficVision AI — production stack (Milestone 4, Intern 5)
#
# Used by the CI/CD deploy stage (.github/workflows/ci.yml). It is copied to the VM as
# ~/trafficvision/docker-compose.yml and runs pre-built images from GHCR; nothing is
# built or bind-mounted on the server.
#
#   IMAGE_PREFIX=ghcr.io/<owner>/trafficvision IMAGE_TAG=sha-<commit> docker compose up -d
#
# Secrets come from ~/trafficvision/.env on the VM (template: .env.prod.example).
# Differences from docker-compose.dev.yml: no --reload, no source bind mounts, Postgres
# and Redis are not published to the internet, memory limits, immutable image tags.
# To use a managed Postgres instead (SRS 7.3), point DATABASE_URL / POSTGRES_HOST in .env
# at it; the local postgres service then just sits idle.

x-app: &app
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - trafficvision_net
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trafficvision}
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-traffic} -d ${POSTGRES_DB:-trafficvision}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - trafficvision_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--maxmemory', '64mb']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96m
    networks:
      - trafficvision_net

  # API gateway: Auth, Monitoring, Prediction, Route Analysis, Alerts.
  backend:
    <<: *app
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-backend:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ALERT_API_URL: http://backend:8000/api/v1/alerts/
      PYTHONUNBUFFERED: '1'
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # Analytics Service (Intern 2). Built from the backend Dockerfile with the analytics
  # source as context, so the app is at /app/src/main.py.
  analytics:
    <<: *app
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-analytics:${IMAGE_TAG:?set IMAGE_TAG}
    working_dir: /app/src
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ANALYTICS_CACHE_ENABLED: 'true'
      ANALYTICS_CACHE_TTL_SECONDS: '60'
      ALERT_API_URL: http://backend:8000/api/v1/alerts/
      PYTHONUNBUFFERED: '1'
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8001:8001'
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --proxy-headers
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384m

  # AI Insights / AI Engine (Intern 3): recommendations and anomaly detection.
  ai:
    <<: *app
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-ai:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      TRAFFIC_API_URL: http://backend:8000/api/v1/traffic/live
      PYTHONUNBUFFERED: '1'
      APP_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8010:8010'
    command: uvicorn app:app --host 0.0.0.0 --port 8010 --proxy-headers
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  trafficvision_net:
    driver: bridge

volumes:
  postgres_data:
